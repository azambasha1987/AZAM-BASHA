name: PNetLab 24h Sync & Verification

on:
  schedule:
    - cron: '0 0 * * *'  # Runs automatically every 24 hours at 00:00 UTC
  workflow_dispatch:      # Allows manual 1-click trigger from GitHub Actions tab

permissions:
  contents: write

defaults:
  run:
    working-directory: EMULATOR/0-P-UNTOUCHED

jobs:
  sync:
    name: Check & Fetch Changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure Git Safe Directory
        working-directory: .
        run: |
          git config --global --add safe.directory "*"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Differential Change Sync
        run: |
          python pnetlab_daily_change_sync.py

      - name: Upload Verification Report & Sync Log
        uses: actions/upload-artifact@v4
        with:
          name: verification-logs
          path: |
            EMULATOR/0-P-UNTOUCHED/VERIFICATION_REPORT.md
            EMULATOR/0-P-UNTOUCHED/sync.log
            EMULATOR/0-P-UNTOUCHED/changes_history.json
            EMULATOR/0-P-UNTOUCHED/state.json

      - name: Commit & Push Changes (if any updates detected)
        working-directory: .
        run: |
          git add EMULATOR/0-P-UNTOUCHED/VERIFICATION_REPORT.md EMULATOR/0-P-UNTOUCHED/sync.log EMULATOR/0-P-UNTOUCHED/changes_history.json EMULATOR/0-P-UNTOUCHED/state.json EMULATOR/0-P-UNTOUCHED/metadata/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit. All files are up to date."
          else
            git commit -m "chore: automated 24h sync update [skip ci]" || echo "Nothing to commit"
            git push origin HEAD || echo "Push skipped: workflow permissions may be read-only"
          fi
